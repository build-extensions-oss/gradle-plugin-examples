name: Pre Merge Checks

on:
  push:
    branches:
      - "main"      # run on master branch only - no need to start the job automatically otherwise
  pull_request:
    branches:
      - "**"      # run on PRs targeting ANY branch (assuming we check the Gradle wrapper first)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle:
    strategy:
      fail-fast: false
      matrix:
        # We expect our plugin works on all these operating systems
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        # Supported JDK versions
        jdk: [ 17, 21, 25 ]
    runs-on: ${{ matrix.os }}
    steps:
      # https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle#using-the-gradle-starter-workflow
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Protect from putting custom jar as a gradle wrapper. Please note - this action validates all such jars
      # https://github.com/gradle/actions/tree/main/wrapper-validation
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # setup JDK - depending on version selected
      # https://github.com/marketplace/actions/setup-java-jdk
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'

      # Optimize Gradle execution
      # https://github.com/marketplace/actions/build-with-gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # We have multiple projects - and we run them with different command to check different scenarios.
      # Why not using GitHub Matrix approach? The answer: we don't need to have clean environment here, so let's achieve a performance boost and simplicity.

      # Check basic publication
      - name: Package artifactory-publish
        working-directory: ./artifactory-publish
        run: ./gradlew helmPackage

      # Check running multiple charts in one project
      - name: Package multiple-charts
        working-directory: ./multiple-charts
        run: ./gradlew helmPackage

      # Check release tags - to verify backward compatibility between version 3.2.1 and 3.3.0
      - name: Test release-tags installation
        working-directory: ./release-tags
        run: ./gradlew helmInstallToApplication --dry-run

      # Self-test to validate this repository.
      - name: Test project version synchronization
        working-directory: ./self-test
        run: ./gradlew test
